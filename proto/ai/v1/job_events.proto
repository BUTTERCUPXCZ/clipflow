syntax = "proto3";

package ai.v1;

// Internal contract: Python worker (client) -> NestJS (server). NestJS is the only database writer;
// it persists these events and forwards them to the desktop over WebSocket.
// Every event carries a per-job sequence number that only grows; NestJS ignores an event whose
// sequence is not greater than the last one applied, and any event for a finished job.
service JobEventsService {
  rpc ReportProgress(ReportProgressRequest) returns (ReportAck);
  rpc ReportCompletion(ReportCompletionRequest) returns (ReportAck);
  rpc ReportFailure(ReportFailureRequest) returns (ReportAck);

  // Model experiments (system-design §10): same sequence and stop semantics as jobs.
  rpc ReportExperimentProgress(ReportExperimentProgressRequest) returns (ReportAck);
  rpc ReportExperimentCompletion(ReportExperimentCompletionRequest) returns (ReportAck);
  rpc ReportExperimentFailure(ReportExperimentFailureRequest) returns (ReportAck);

  // Phase 5: editing plans, same ack rules.
  rpc ReportPlanProgress(ReportPlanProgressRequest) returns (ReportAck);
  rpc ReportPlanCompletion(ReportPlanCompletionRequest) returns (ReportAck);
  rpc ReportPlanFailure(ReportPlanFailureRequest) returns (ReportAck);

  // Phase 6: rendering, same ack rules.
  rpc ReportRenderProgress(ReportRenderProgressRequest) returns (ReportAck);
  rpc ReportRenderCompletion(ReportRenderCompletionRequest) returns (ReportAck);
  rpc ReportRenderFailure(ReportRenderFailureRequest) returns (ReportAck);
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_VALIDATING = 1;
  JOB_STATUS_EXTRACTING_MEDIA = 2;
  JOB_STATUS_TRANSCRIBING = 3;
  JOB_STATUS_ANALYZING_VISUALS = 4;
}

enum JobErrorCode {
  JOB_ERROR_CODE_UNSPECIFIED = 0;
  JOB_ERROR_CODE_MEDIA_UNDECODABLE = 1;
  JOB_ERROR_CODE_FFMPEG_FAILED = 2;
  JOB_ERROR_CODE_INTERRUPTED = 3;
  JOB_ERROR_CODE_CANCELLED = 4;
  JOB_ERROR_CODE_INTERNAL = 5;
  JOB_ERROR_CODE_MODEL_RUNTIME_UNAVAILABLE = 6;
  JOB_ERROR_CODE_MODEL_NOT_INSTALLED = 7;
  JOB_ERROR_CODE_TRANSCRIPTION_FAILED = 8;
  JOB_ERROR_CODE_VISION_INVALID = 9;  // not one batch of model output passed validation
  JOB_ERROR_CODE_NO_SPEECH = 10;      // planning needs a transcript with speech
  JOB_ERROR_CODE_PLAN_INVALID = 11;   // no clip survived validation
  JOB_ERROR_CODE_RENDER_FAILED = 12;  // no clip could be rendered
}

message ReportProgressRequest {
  string job_id = 1;
  int64 sequence = 2;
  JobStatus status = 3;
  string stage = 4;     // human-readable, e.g. "Extracting audio and frames"
  int32 progress = 5;   // 0-100
  string message = 6;
}

message JobArtifacts {
  bool has_audio = 1;
  string audio_path = 2;  // relative to MEDIA_ROOT; empty without audio
  double audio_duration_seconds = 3;
  int32 frame_count = 4;
  double frame_interval_seconds = 5;
  string frames_path = 6; // relative directory holding frame-000001.jpg ... and frames.json
  string transcript_path = 7;  // relative; empty without audio
  string visual_path = 8;      // relative visual.json
  int32 valid_batches = 9;
  int32 total_batches = 10;
}

message ReportCompletionRequest {
  string job_id = 1;
  int64 sequence = 2;
  JobArtifacts artifacts = 3;
}

message ReportFailureRequest {
  string job_id = 1;
  int64 sequence = 2;
  JobErrorCode error_code = 3;
  string error_message = 4;
}

message ReportAck {
  bool applied = 1;  // false: duplicate, out of order, or the job already finished
  // true when the job no longer exists or is already finished/cancelled (e.g. its video was deleted):
  // the worker must stop and clean up. Lets deletes cancel work without coupling modules.
  bool stop = 2;
}

message ExperimentMetrics {
  int64 load_ms = 1;
  int64 inference_ms = 2;
  int64 total_ms = 3;
  int32 peak_vram_mib = 4;  // -1 when no NVIDIA GPU was visible
  int32 frames_analysed = 5;
  int32 valid_batches = 6;
  int32 total_batches = 7;
}

message ReportExperimentProgressRequest {
  string experiment_id = 1;
  int64 sequence = 2;
  int32 progress = 3;
  string message = 4;
}

message ReportExperimentCompletionRequest {
  string experiment_id = 1;
  int64 sequence = 2;
  string output_path = 3;  // relative visual.json
  ExperimentMetrics metrics = 4;
}

message ReportExperimentFailureRequest {
  string experiment_id = 1;
  int64 sequence = 2;
  JobErrorCode error_code = 3;
  string error_message = 4;
}

message PlanMetrics {
  int32 llm_calls = 1;
  int64 elapsed_ms = 2;
  int32 windows = 3;
  int32 skipped_windows = 4;
  int32 clip_count = 5;
}

message ReportPlanProgressRequest {
  string plan_id = 1;
  int64 sequence = 2;
  int32 progress = 3;
  string message = 4;
}

message ReportPlanCompletionRequest {
  string plan_id = 1;
  int64 sequence = 2;
  string output_path = 3;  // plan.json, relative to MEDIA_ROOT
  PlanMetrics metrics = 4;
}

message ReportPlanFailureRequest {
  string plan_id = 1;
  int64 sequence = 2;
  JobErrorCode error_code = 3;
  string error_message = 4;
}

message RenderMetrics {
  int32 rendered = 1;
  int32 failed = 2;
  int64 elapsed_ms = 3;
  string encoder = 4;
}

message ReportRenderProgressRequest {
  string render_id = 1;
  int64 sequence = 2;
  int32 progress = 3;
  string message = 4;
}

message ReportRenderCompletionRequest {
  string render_id = 1;
  int64 sequence = 2;
  string output_path = 3;  // render.json, relative to MEDIA_ROOT
  RenderMetrics metrics = 4;
}

message ReportRenderFailureRequest {
  string render_id = 1;
  int64 sequence = 2;
  JobErrorCode error_code = 3;
  string error_message = 4;
}
